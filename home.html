<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f6">
<title>Pitch Predictor</title>
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --line: #d8e0ea;
    --ink: #1f2937;
    --dim: #64748b;
    --accent: #1d4ed8;
    --accent-ink: #ffffff;
    --accent-soft: #eaf0ff;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 18px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 600;
    overscroll-behavior: none;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 18px 26px; }

  header.bar { text-align: center; margin-bottom: 34px; }
  .logo { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); }
  .logo b { color: var(--accent); }
  .subtitle { color: var(--dim); font-size: 12px; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 700; margin-top: 6px; }

  .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 640px) { .tile-grid { grid-template-columns: 1fr; } }

  .tile {
    display: block; text-align: left; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow); cursor: pointer;
    font: inherit; width: 100%;
    transition: border-color .14s, transform .06s, box-shadow .14s;
    position: relative;
  }
  .tile:hover { border-color: #b8c5d6; }
  .tile:active { transform: scale(.98); }
  .tile.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tile .icon { font-size: 28px; line-height: 1; margin-bottom: 10px; display: block; }
  .tile .name { font-size: 18px; font-weight: 800; display: block; }
  .tile .desc { font-size: 13px; font-weight: 600; color: var(--dim); margin-top: 4px; display: block; }
  .tile.primary .desc { color: var(--accent-soft); }
  .tile .soon {
    position: absolute; top: 16px; right: 16px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    font-weight: 800; color: var(--dim); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px;
  }

  .status { margin-top: 18px; text-align: center; font-size: 13px; font-weight: 700; color: var(--dim); min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <div class="logo">Pitch<b>Predictor</b></div>
    <div class="subtitle">Home</div>
  </header>

  <div class="tile-grid">
    <a class="tile primary" href="index.html">
      <span class="icon">&#9654;</span>
      <span class="name">New Game</span>
      <span class="desc">Jump straight into the pitch predictor</span>
    </a>

    <button class="tile" data-soon="Save Pitchers will let you keep a library of pitcher arsenals to load into a game without re-entering their averages.">
      <span class="soon">Soon</span>
      <span class="icon">&#9993;</span>
      <span class="name">Save Pitchers</span>
      <span class="desc">Build a reusable library of pitcher arsenals</span>
    </button>

    <button class="tile" data-soon="Save Teams will let you group pitchers and batters into a team roster you can load all at once.">
      <span class="soon">Soon</span>
      <span class="icon">&#128101;</span>
      <span class="name">Save Teams</span>
      <span class="desc">Group pitchers and batters into a roster</span>
    </button>

    <button class="tile" data-soon="Saved Games will let you pick up an in-progress or past game where you left off, instead of only remembering the last one.">
      <span class="soon">Soon</span>
      <span class="icon">&#128190;</span>
      <span class="name">Saved Games</span>
      <span class="desc">Resume a game you started earlier</span>
    </button>

    <button class="tile" data-soon="Records will track outcomes over time - results by pitch type, count, and matchup.">
      <span class="soon">Soon</span>
      <span class="icon">&#128202;</span>
      <span class="name">Records</span>
      <span class="desc">See how your calls have played out</span>
    </button>
  </div>

  <div class="status" id="status"></div>

</div>
<script>
"use strict";
const statusEl = document.getElementById("status");
document.querySelectorAll(".tile[data-soon]").forEach(btn => {
  btn.addEventListener("click", () => { statusEl.textContent = btn.dataset.soon; });
});
</script>
</body>
</html>
